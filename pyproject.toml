[project]
name = "interview-prep"
version = "0.1.0"
description = "Local workspace for DS&A interview practice — not for publishing"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_prep"]

[tool.pyright]
# LeetCode's ListNode/TreeNode stubs are untyped, so pointer walks like
# `slow.next.next` look like attribute access on None. LeetCode does not
# type-check, and asserts to appease the checker would be interview noise.
reportOptionalMemberAccess = "none"
